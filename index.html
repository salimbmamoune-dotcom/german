<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تعلم كلمات ألمانية</title>
  <link rel="icon" href="fv.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <nav class="navbar">
      <div class="navbar-brand">
        <div class="brand-icon">📚</div>
        <div class="brand-text">
          <h1>تعلم كلمات ألمانية</h1>
        </div>
      </div>
      
      <div class="navbar-actions">
        <div class="search-container">
          <input id="search" placeholder="ابحث..." class="search-input">
        </div>
        
        <button id="btn-import" class="btn btn-primary">📥 استيراد</button>
        <button id="btn-export" class="btn btn-secondary">💾 تصدير</button>
        <button id="btn-export-filtered" class="btn btn-outline">📤 مفلتر</button>
        <button id="settings-toggle" class="btn btn-ghost">⚙️</button>
      </div>
    </nav>

    <div class="main-container">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>اليوميات</h2>
        </div>
        <div class="days-list" id="days-list"></div>
      </aside>

      <main class="content" id="main-content">
        <section class="progress-section">
          <h2>تقدمك</h2>
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="totalWords">0</div>
              <div class="stat-label">كلمة</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="learnedCount">0</div>
              <div class="stat-label">تعلمت</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="remainingCount">0</div>
              <div class="stat-label">متبقي</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="imagesCount">0</div>
              <div class="stat-label">صور</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="favoritesCount">0</div>
              <div class="stat-label">مفضلة</div>
            </div>
          </div>
          <div class="progress-bar" id="progressBar"></div>
        </section>

        <section class="filter-section">
          <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">📚 الكل</button>
            <button class="filter-tab" data-filter="nomen">🏷️ أسماء</button>
            <button class="filter-tab" data-filter="verb">🏃 أفعال</button>
            <button class="filter-tab" data-filter="adjektiv">🎨 صفات</button>
            <button class="filter-tab" data-filter="redewendung">💬 تعبيرات</button>
            <button class="filter-tab" data-filter="favorites">⭐ المفضلة</button>
          </div>
        </section>

        <section class="words-section">
          <div class="section-header">
            <h2 id="dayTitle">اليوم 1</h2>
            <div class="section-actions">
              <button id="bulk-mark-learned" class="btn btn-success btn-sm">✅ تعليم الكل</button>
              <button id="bulk-add-favorites" class="btn btn-warning btn-sm">⭐ مفضلة الكل</button>
              <button id="clear-learned" class="btn btn-danger btn-sm">🔄 إعادة تعيين</button>
            </div>
          </div>
          
          <div id="wordCards" class="word-cards-grid"></div>
          <button id="loadMore" class="btn btn-primary load-more" style="display:none">⬇️ تحميل المزيد</button>
          <div id="empty" class="empty-state" style="display:none">لا توجد كلمات</div>
        </section>
      </main>
    </div>

    <div class="settings-panel" id="settings-panel">
      <div class="settings-header">
        <h3 id="settings-title">الإعدادات</h3>
        <button id="close-settings" class="btn btn-ghost btn-sm">✕</button>
      </div>

      <div class="settings-content">
        <div class="setting-group">
          <h4>المظهر</h4>
          <button id="toggle-dark" class="btn btn-outline">🌙 الوضع المظلم</button>
        </div>
        
        <div class="setting-group">
          <h4>الصوت</h4>
          <button id="toggle-tts" class="btn btn-outline">🔊 TTS</button>
        </div>
        
        <div class="setting-group">
          <h4>العرض</h4>
          <button id="toggle-favorites" class="btn btn-outline">⭐ المفضلة فقط</button>
          <button id="toggle-hide-translation" class="btn btn-outline">👁️ إخفاء الترجمة</button>
        </div>
        
        <div class="setting-group">
          <h4>الصور</h4>
          <button id="btn-add-image" class="btn btn-outline">🖼️ إضافة صورة</button>
        </div>
      </div>
    </div>

    <div class="modal" id="imageModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="imageModalTitle">إضافة صورة</h3>
          <button class="modal-close" id="closeImageModal">&times;</button>
        </div>
        <div class="modal-body">
          <label for="imageUrl">رابط الصورة:</label>
          <input type="text" id="imageUrl" class="modal-input" placeholder="أدخل رابط الصورة">
          <button id="pasteUrl" class="modal-btn secondary">لصق</button>
          
          <label for="imageSearch">البحث:</label>
          <input type="text" id="imageSearch" class="modal-input" placeholder="ابحث عن صورة">
          <button id="searchImage" class="modal-btn secondary">بحث</button>
          
          <div id="imagePreview" class="modal-preview">
            <img id="previewImg" src="" alt="معاينة">
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn secondary" id="cancelImage">إلغاء</button>
          <button class="modal-btn primary" id="saveImage">حفظ</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="./app.js?v=16"></script>
</body>
</html>
